name: CPU raster benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - GhostEngine
    paths:
      - "ghostengine/crates/ghostengine/src/**"
      - "ghostengine/crates/ghostengine/examples/cpu_raster_bench.rs"
      - "ghostengine/crates/ghostengine/Cargo.toml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Release CPU raster benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run CPU raster benchmark
        working-directory: ghostengine
        shell: bash
        run: cargo run --release -p ghostengine --example cpu_raster_bench -- 100 | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cpu-raster-benchmark-${{ matrix.os }}
          path: ghostengine/benchmark-results.txt
          if-no-files-found: error
          retention-days: 30
