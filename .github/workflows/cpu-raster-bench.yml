name: CPU raster benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - GhostEngine
    paths:
      - ".github/workflows/cpu-raster-bench.yml"
      - "ghostengine/crates/ghostengine/src/rasterizer.rs"
      - "ghostengine/crates/ghostengine/src/stroke.rs"
      - "ghostengine/crates/ghostengine/src/path.rs"
      - "ghostengine/crates/ghostengine/src/path_cache.rs"
      - "ghostengine/crates/ghostengine/src/display_list.rs"
      - "ghostengine/crates/ghostengine/src/text.rs"
      - "ghostengine/crates/ghostengine/src/shaping.rs"
      - "ghostengine/crates/ghostengine/src/ui.rs"
      - "ghostengine/crates/ghostengine/src/texture.rs"
      - "ghostengine/crates/ghostengine/src/texture_atlas.rs"
      - "ghostengine/crates/ghostengine/src/texture_cache.rs"
      - "ghostengine/crates/ghostengine/src/mipmap.rs"
      - "ghostengine/crates/ghostengine/src/composition.rs"
      - "ghostengine/crates/ghostengine/src/cached_layer.rs"
      - "ghostengine/crates/ghostengine/src/framebuffer.rs"
      - "ghostengine/crates/ghostengine/src/simd.rs"
      - "ghostengine/crates/ghostengine/examples/cpu_raster_bench.rs"
      - "ghostengine/crates/ghostengine/Cargo.toml"
      - "ghostengine/Cargo.toml"

permissions:
  contents: read

# Keep benchmark results associated with the exact source revision.
# Avoid cancelling a run merely because another commit was pushed afterward.
concurrency:
  group: ghostengine-cpu-bench-${{ github.sha }}
  cancel-in-progress: false

jobs:
  benchmark:
    timeout-minutes: 60
    name: Release CPU raster benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run CPU raster benchmark
        working-directory: ghostengine
        shell: bash
        run: cargo run --release -p ghostengine --example cpu_raster_bench -- 100 | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cpu-raster-benchmark-${{ matrix.os }}
          path: ghostengine/benchmark-results.txt
          if-no-files-found: error
          retention-days: 30
