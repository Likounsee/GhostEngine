name: GhostEngine CI

on:
  push:
    branches: [GhostEngine]
  pull_request:
    branches: [GhostEngine]

permissions:
  contents: read

# Keep only the newest run for this workflow and branch.
# A new push cancels an in-progress run and replaces an older queued run.
concurrency:
  group: ghostengine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    timeout-minutes: 35
    name: Format, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: ghostengine
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: ghostengine
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test scalar single-threaded fallback
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features

      - name: Test SIMD without automatic parallel selection
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features simd

      - name: Test parallel rendering with scalar blending
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features parallel-rendering

      - name: Test native input without minifb
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features native-input

      - name: Run tests with all optional features
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --all-features
