name: GhostEngine CI

on:
  push:
    branches: [GhostEngine]
  pull_request:
    branches: [GhostEngine]

permissions:
  contents: read

# Only the newest commit on a branch needs a full matrix. Cancel stale queued
# or running matrices so release validation is not delayed by obsolete commits.
concurrency:
  group: ghostengine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    timeout-minutes: 20
    name: Minimum supported Rust (1.87)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Check all features, targets and examples on the declared MSRV
        working-directory: ghostengine
        run: cargo check --workspace --all-targets --all-features

  rust:
    timeout-minutes: 35
    name: Format, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: ghostengine
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: ghostengine
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build public API documentation
        working-directory: ghostengine
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Verify distributable crate includes documentation and license notices
        working-directory: ghostengine
        shell: bash
        run: |
          files="$(cargo package -p ghostengine --list)"
          printf '%s\n' "$files"
          for required in README.md LICENSE-MIT LICENSE-APACHE tests/fixtures/README.md tests/fixtures/OFL-NotoSansArabic.txt tests/fixtures/OFL-NotoSansHebrew.txt; do
            if ! grep -Fxq "$required" <<< "$files"; then
              echo "Missing required file from ghostengine package: $required"
              exit 1
            fi
          done

      - name: Build the packaged crate
        working-directory: ghostengine
        run: cargo package -p ghostengine --locked

      - name: Test scalar fallback without automatic parallel selection
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features

      - name: Test SIMD without automatic parallel selection
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features simd

      - name: Test parallel rendering with scalar blending
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features parallel-rendering

      - name: Test native input without minifb
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features native-input

      - name: Test native window backend without default features
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features native-window

      - name: Run tests with all optional features
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --all-features

      - name: Run first CPU image example
        working-directory: ghostengine
        shell: bash
        run: |
          cargo run -p ghostengine --release --example first_image -- target/ghostengine-first-image.ppm
          test -s target/ghostengine-first-image.ppm

      - name: Run headless host example
        working-directory: ghostengine
        run: cargo run -p ghostengine --release --example headless_host_demo

      - name: Run headless vector path showcase
        working-directory: ghostengine
        run: cargo run -p ghostengine --release --example vector_path_showcase -- target/ghostengine-vector-showcase.ppm

      - name: Run headless image decoding and mipmap showcase
        run: cargo run --manifest-path ghostengine/Cargo.toml --release --features image-decoding --example image_pipeline_demo -- "Amethys-Launcher test/assets/covers/hades.png" ghostengine/target/ghostengine-image-pipeline.ppm

      - name: Format Amethys Launcher integration tests
        run: rustfmt --edition 2021 --check "Amethys-Launcher test/tests/launcher_integration.rs"

      - name: Test Amethys Launcher integration
        run: cargo test --manifest-path "Amethys-Launcher test/Cargo.toml" --all-targets --all-features --locked

      - name: Render scripted Amethys Launcher session (headless)
        run: cargo run --manifest-path "Amethys-Launcher test/Cargo.toml" --release -- --snapshot "target/amethyst-launcher-snapshots"

      - name: Verify Amethys Launcher screenshots
        shell: bash
        run: |
          count="$(find target/amethyst-launcher-snapshots -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$count" -ne 18 ]; then
            echo "Expected 18 scripted PNG frames, found $count"
            exit 1
          fi
