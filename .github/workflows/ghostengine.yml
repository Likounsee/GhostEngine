name: GhostEngine CI

on:
  push:
    branches: [GhostEngine]
  pull_request:
    branches: [GhostEngine]

permissions:
  contents: read

# A burst of direct commits must not leave dozens of obsolete full test matrices
# queued behind the latest source state; cancel obsolete matrices when a newer commit arrives.
concurrency:
  group: ghostengine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    timeout-minutes: 35
    name: Format, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: ghostengine
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: ghostengine
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build public API documentation
        working-directory: ghostengine
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Test scalar fallback without automatic parallel selection
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features

      - name: Test SIMD without automatic parallel selection
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features simd

      - name: Test parallel rendering with scalar blending
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features parallel-rendering

      - name: Test native input without minifb
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features native-input

      - name: Test native window backend without default features
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --no-default-features --features native-window

      - name: Run tests with all optional features
        working-directory: ghostengine
        run: cargo test --workspace --all-targets --all-features

      - name: Run headless vector path showcase
        working-directory: ghostengine
        run: cargo run -p ghostengine --release --example vector_path_showcase -- target/ghostengine-vector-showcase.ppm

      - name: Format Amethys Launcher integration tests
        run: rustfmt --edition 2021 --check "Amethys-Launcher test/tests/launcher_integration.rs"

      - name: Test Amethys Launcher integration
        run: cargo test --manifest-path "Amethys-Launcher test/Cargo.toml" --all-targets --all-features

      - name: Render scripted Amethys Launcher session (headless)
        run: cargo run --manifest-path "Amethys-Launcher test/Cargo.toml" --release -- --snapshot "target/amethyst-launcher-snapshots"

      - name: Verify Amethys Launcher screenshots
        shell: bash
        run: |
          count="$(find target/amethyst-launcher-snapshots -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$count" -ne 18 ]; then
            echo "Expected 18 scripted PNG frames, found $count"
            exit 1
          fi
