[workspace]
members = ["crates/ghostengine"]
resolver = "2"

# Let LLVM optimize across crate boundaries and specialize hot rasterizer kernels.
# Keep these workspace-wide release settings under the CPU raster benchmark gate.
# No target-specific intrinsics, nightly features, or unsafe code are required.
[profile.release]
lto = "thin"
codegen-units = 1
