[package]
name = "ghostengine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An independent CPU-first 2D and 3D rendering engine."
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[features]
default = []
window = ["dep:minifb"]

[dependencies]
fontdue = "0.9"
rustybuzz = "0.20"
unicode-bidi = "0.3.18"
minifb = { version = "0.27", optional = true }

[[example]]
name = "browser_frontend"
required-features = ["window"]
