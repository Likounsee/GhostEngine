[package]
name = "ghostengine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An independent CPU-first 2D and 3D rendering engine."
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[features]
default = []
window = ["dep:minifb"]
native-input = ["window", "dep:winit", "dep:arboard"]
native-window = ["native-input", "dep:softbuffer"]
image-decoding = ["dep:image"]

[dependencies]
fontdue = "0.9"
rustybuzz = "0.20"
unicode-bidi = "0.3.18"
unicode-segmentation = "1.12"
minifb = { version = "0.27", optional = true }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"], optional = true }
arboard = { version = "3", optional = true }
softbuffer = { version = "0.4.8", optional = true }
image = { version = "=0.25.0", default-features = false, features = ["bmp", "jpeg", "png", "pnm"], optional = true }

[[example]]
name = "browser_frontend"
required-features = ["window"]

[[example]]
name = "native_ui_demo"
required-features = ["native-window"]

[[example]]
name = "cpu_raster_bench"
